[package]
name = "data-parser"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib"]
[dependencies]
ring = "0.17"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = "2.1"
zeroize = { version = "1.7", features = ["derive"] }
hkdf = "0.12"
sha2 = "0.10"
