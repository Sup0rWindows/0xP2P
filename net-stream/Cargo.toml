[package]
name = "net-stream"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }

libp2p = { version = "0.52", features = ["tcp", "dns", "websocket", "noise", "yamux", "kad", "identify", "macros", "tokio"] }

zeroize = { version = "1.7", features = ["derive"] }

futures = "0.3"
bytes = "1.5"
