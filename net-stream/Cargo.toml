[package]
name = "net_stream"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
libp2p = { version = "0.53", features = ["tokio", "tcp", "quic", "noise", "yamux", "kad", "identify", "dcutr", "relay"] }
futures = "0.3"
tokio = { version = "1.38", features = ["full"] }
libc = "0.2"

data_parser = { path = "../data-parser" }
